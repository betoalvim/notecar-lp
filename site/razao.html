<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Notecar</title>
<link href="https://fonts.googleapis.com/css2?family=Glory:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Playpen+Sans:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
 --navy:#102A43;--navy2:#1B3A57;--teal-dk:#0E6474;--teal:#0B9EA5;--teal-md:#46B5BA;
 --teal-lt:#80CBCF;--teal-pl:#BAE1E4;--surf:#F4F7F8;--surf2:#E4EAEE;
 --cinza:#34434E;--cinza2:#7B8894;--laranja:#E8503A;--laranja-dk:#C0402C;
 --ambar:#D9A22B;--ambar-dk:#8A6A1F;--ambar-pl:#F6E7C8;
 --d:'Glory',system-ui,sans-serif;--m:'JetBrains Mono',monospace;--p:'Playpen Sans',cursive;
 --e:cubic-bezier(.4,0,.2,1);
 /* ---- escala mobile-first ---- */
 --pad:16px;
 --cx-w:88vw;          /* painel de título */
 --cd-w:41vw;          /* card de apoio — sempre menor que o painel */
 --t1:19px;            /* título Glory */
 --t1f:23px;           /* título forte, blocos sem manuscrita */
 --t2:2.05em;          /* manuscrita */
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;
 -webkit-user-select:none;user-select:none}
body{background:#9FB4C0;color:#fff;font-family:var(--d);-webkit-font-smoothing:antialiased}
#palco{position:fixed;inset:0;overflow:hidden;touch-action:none;cursor:pointer}
svg#cena{width:100%;height:100%;display:block}

/* ═══ PAINEL DE TÍTULO ═══ */
#caixa{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);
 transform:translateX(-50%) translateY(-10px) scale(.97);width:var(--cx-w);max-width:520px;
 padding:15px 17px 16px;text-align:center;border-radius:18px 9px 18px 9px;
 background:linear-gradient(160deg,rgba(255,255,255,.80),rgba(244,247,248,.62));
 border:1px solid rgba(255,255,255,.78);
 box-shadow:0 16px 40px rgba(16,42,67,.20),inset 0 1px 0 rgba(255,255,255,.9);
 backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);
 opacity:0;transition:opacity .55s var(--e),transform .55s var(--e);z-index:30;pointer-events:none}
#caixa.on{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
.tt{font-size:var(--t1);font-weight:500;line-height:1.24;letter-spacing:-.004em;
 color:rgba(16,42,67,.80);margin:0 auto}
.tt>.ln{max-width:30ch;margin:0 auto}
#caixa.gancho{padding-left:13px;padding-right:13px}

#caixa.forte .tt{font-size:var(--t1f);font-weight:700;color:var(--navy);line-height:1.16;
 letter-spacing:-.018em}
#caixa.forte .tt>.ln{max-width:20ch}
.pre{font-size:calc(var(--t1) * 1.06);font-weight:600;color:rgba(16,42,67,.58);
 line-height:1.2;letter-spacing:-.01em;margin-bottom:6px}
.dz{display:block;width:100%;font-family:var(--p);font-weight:700;font-size:var(--t2);
 color:var(--teal-dk);line-height:1.04;letter-spacing:-.028em;margin-top:.30em}
.dz.fogo{color:var(--laranja);font-size:2.75em}
#caixa.gancho .tt{font-size:var(--t1);font-weight:500;
 color:rgba(16,42,67,.80);line-height:1.26}
#caixa.gancho .tt>.ln{max-width:26ch}
#caixa.gancho .dz{margin-top:.30em;color:var(--teal-dk);letter-spacing:-.040em;
 font-size:clamp(38px,12.6vw,78px);line-height:.98}
@media(min-width:600px){#caixa.gancho .dz{font-size:clamp(52px,7.6vw,80px)}}
@media(min-width:1000px){#caixa.gancho .dz{font-size:clamp(60px,5.4vw,92px)}}
.sb{font-size:15px;line-height:1.44;color:rgba(52,67,78,.86);margin-top:10px;max-width:30ch;
 margin-left:auto;margin-right:auto}
.mn{font-family:var(--m);font-size:10px;letter-spacing:.10em;text-transform:uppercase;
 color:var(--navy);opacity:.82;font-weight:600;margin-top:11px}
.ap{font-size:12.5px;line-height:1.52;font-style:italic;color:rgba(16,42,67,.86);font-weight:500;
 text-align:left;border-left:2px solid var(--teal);padding-left:11px;margin-top:13px}
.w{display:inline-block;opacity:0;filter:blur(8px);transform:translateY(22px) scale(1.16);
 transition:opacity .5s var(--e) var(--dl),transform .74s cubic-bezier(.14,.96,.26,1) var(--dl),
 filter .46s var(--e) var(--dl)}
#caixa.on .w{opacity:1;filter:blur(0);transform:none}
.ln{display:block}
.fade{opacity:0;transform:translateY(9px);transition:opacity .55s var(--e) var(--dl),transform .6s var(--e) var(--dl)}
#caixa.on .fade{opacity:1;transform:none}
#caixa.on .mn.fade{opacity:.78}
#caixa.on .ap.fade{opacity:1}

/* ═══ CARDS DE APOIO — miniaturas ═══ */
#apoio{position:absolute;left:50%;transform:translateX(-50%);z-index:26;
 display:flex;gap:7px;align-items:flex-start;justify-content:center;
 width:92vw;max-width:560px;pointer-events:none}
.cd{background:linear-gradient(180deg,rgba(255,255,255,.90),rgba(244,247,248,.76));
 border:1px solid rgba(255,255,255,.8);border-radius:11px 6px 11px 6px;color:var(--navy);
 padding:7px 8px;box-shadow:0 9px 22px rgba(16,42,67,.22);
 backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
 opacity:0;transform:translateY(-6px) scale(1.05);
 transition:opacity .5s var(--e) var(--dl),transform .55s var(--e) var(--dl)}
#apoio.on .cd{opacity:1;transform:none}
.cd{transform-style:preserve-3d;backface-visibility:hidden}
.cd .r{font-family:var(--m);font-size:6px;letter-spacing:.13em;text-transform:uppercase;
 color:var(--cinza2);margin-bottom:4px;font-weight:700}
.cd .g{font-size:13px;font-weight:800;letter-spacing:-.02em;line-height:1}
.cd .g s{text-decoration:none;font-size:7px;font-weight:600}
.cd .l{display:flex;justify-content:space-between;gap:6px;font-size:7.5px;padding:2.5px 0;
 border-top:1px solid rgba(52,67,78,.10);color:var(--cinza);align-items:baseline}
.cd .l b{font-family:var(--m);font-weight:500;font-size:7.5px}
.cd .n{font-size:8.5px;font-weight:700;line-height:1.15}
.bd{display:inline-block;font-family:var(--m);font-size:5.5px;font-weight:700;letter-spacing:.11em;
 padding:2px 5px;border-radius:99px;text-transform:uppercase}
.bd.c{background:var(--teal-pl);color:var(--teal-dk)}
.bd.i{background:var(--surf2);color:var(--cinza)}
.bd.a{background:var(--ambar-pl);color:var(--ambar-dk)}
.bd.o{background:#FBDDD7;color:var(--laranja-dk)}
.hl{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;
 padding:4px 0;border-top:1px solid rgba(52,67,78,.10)}
.hl:first-of-type{border-top:none}
.hl .e{font-size:8px;font-weight:700;line-height:1.2;color:var(--navy)}
.hl .m{font-family:var(--m);font-size:5.5px;letter-spacing:.06em;color:var(--cinza2);margin-top:1px}
.hl .v{font-family:var(--m);font-size:8px;font-weight:500;white-space:nowrap}
.cab{background:linear-gradient(180deg,var(--navy2),#0D1C2B);color:#fff;margin:-7px -8px 7px;
 padding:6px 8px;border-radius:11px 6px 0 0}
.cab h4{font-size:7.5px;font-weight:800;text-transform:uppercase;letter-spacing:.02em}
.cab i{display:block;font-family:var(--m);font-size:5px;letter-spacing:.11em;
 color:var(--teal-lt);font-style:normal;margin-top:2px}

/* ═══ HODÔMETRO ═══ */
#odo{position:absolute;left:12px;top:50%;transform:translateY(-50%);z-index:24;
 opacity:0;transition:opacity .7s var(--e);pointer-events:none}
#odo.on{opacity:1}
#odo .b{position:absolute;left:-7px;top:1px;width:2px;height:20px;background:var(--laranja);
 border-radius:2px;box-shadow:0 0 12px rgba(232,80,58,.7)}
#odo .n{font-family:var(--m);font-size:21px;font-weight:700;color:var(--navy);line-height:1;
 font-variant-numeric:tabular-nums;text-shadow:0 1px 10px rgba(255,255,255,.7)}
#odo .u{font-family:var(--m);font-size:6.5px;letter-spacing:.18em;color:var(--navy);opacity:.62;margin-top:4px;font-weight:600}
#cone{position:absolute;inset:0;z-index:9;pointer-events:none;
 backdrop-filter:blur(2.6px);-webkit-backdrop-filter:blur(2.6px);
 -webkit-mask-image:radial-gradient(ellipse 96% 62% at 50% 92%,transparent 46%,#000 96%);
 mask-image:radial-gradient(ellipse 96% 62% at 50% 92%,transparent 46%,#000 96%)}
#haze{position:absolute;inset:0;z-index:10;pointer-events:none;
 background:radial-gradient(ellipse 104% 66% at 50% 92%,
  rgba(214,232,236,0) 48%,rgba(214,232,236,.18) 76%,rgba(214,232,236,.40) 100%)}
#reg{position:absolute;left:0;top:0;bottom:0;width:120px;z-index:23;pointer-events:none;
 opacity:0;transition:opacity .7s var(--e);
 -webkit-mask-image:linear-gradient(180deg,transparent 6%,#000 28%,#000 72%,transparent 94%);
 mask-image:linear-gradient(180deg,transparent 6%,#000 28%,#000 72%,transparent 94%)}
#reg.on{opacity:1}
.rg{position:absolute;left:12px;display:flex;align-items:center;gap:7px;font-family:var(--m);
 white-space:nowrap;transform-origin:left center}
.rg i{display:block;height:1px;background:currentColor;border-radius:1px}
.rg b{font-weight:400;letter-spacing:.06em;font-variant-numeric:tabular-nums}

/* ═══ NAV ═══ */
#nav{position:absolute;right:11px;top:50%;transform:translateY(-50%);z-index:40;
 display:flex;flex-direction:column;align-items:center;gap:11px}
#nav button{touch-action:manipulation;-webkit-appearance:none;border:1px solid rgba(255,255,255,.5);background:rgba(16,42,67,.30);
 color:#fff;border-radius:50%;display:grid;place-items:center;cursor:pointer;
 backdrop-filter:blur(6px);transition:all .3s var(--e);padding:0}
#pv{width:29px;height:29px}#nx{width:38px;height:38px}
#nx:active,#pv:active{background:var(--laranja);border-color:var(--laranja)}
button.fim{opacity:.22;pointer-events:none}
#pts{display:flex;flex-direction:column;gap:7px}
.pt{touch-action:manipulation;-webkit-appearance:none;width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.45);border:none;
 padding:0;cursor:pointer;transition:all .4s var(--e)}
.pt.on{background:var(--laranja);transform:scale(1.6)}
.pt.ps{background:rgba(255,255,255,.85)}

/* ═══ CTA ═══ */
#cta{touch-action:manipulation;-webkit-appearance:none;position:absolute;left:50%;transform:translateX(-50%) translateY(14px);
 bottom:calc(env(safe-area-inset-bottom,0px) + 14px);z-index:42;
 background:var(--laranja);color:#fff;font-family:var(--d);font-size:13px;font-weight:700;
 border:none;border-radius:99px;padding:10px 20px;cursor:pointer;white-space:nowrap;
 box-shadow:0 8px 22px rgba(232,80,58,.38);opacity:0;
 transition:opacity .5s var(--e),transform .5s var(--e)}
#cta.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ═══ ABERTURA ═══ */
#hero{position:absolute;inset:0;z-index:50;cursor:pointer;display:flex;flex-direction:column;
 align-items:center;justify-content:center;padding:0 8vw;text-align:center;
 transition:opacity .8s var(--e),transform .8s var(--e)}
#hero.fora{opacity:0;transform:scale(1.1);pointer-events:none}
#vidro{padding:30px 22px 24px;max-width:96vw;border-radius:24px 12px 24px 12px;
 background:linear-gradient(160deg,rgba(255,255,255,.72),rgba(244,247,248,.52));
 border:1px solid rgba(255,255,255,.8);box-shadow:0 22px 56px rgba(16,42,67,.24);
 backdrop-filter:blur(20px) saturate(1.35);-webkit-backdrop-filter:blur(20px) saturate(1.35);
 display:flex;flex-direction:column;align-items:center;animation:sobe 1.4s var(--e) both}
@keyframes sobe{from{opacity:0;transform:scale(1.14);filter:blur(12px)}to{opacity:1;transform:none;filter:none}}
#lg{width:min(230px,54vw);height:auto}
@media(max-width:412px){#func{font-size:3.42vw}}
#tag{margin-top:14px;font-family:var(--m);font-size:10.5px;letter-spacing:.20em;
 text-transform:uppercase;color:var(--navy);font-weight:500}
#func{margin-top:14px;max-width:none;font-size:14px;line-height:1.45;font-weight:500;
 color:rgba(16,42,67,.82);animation:sobe 1.5s .22s var(--e) both}
#func span{display:block;white-space:nowrap}
@media(min-width:600px){#func{font-size:16px;margin-top:16px}}
@media(min-width:1000px){#func{font-size:18px}}
#gof{margin-top:22px;display:flex;align-items:center;gap:9px;font-family:var(--m);font-size:9.5px;
 letter-spacing:.15em;text-transform:uppercase;color:var(--laranja);font-weight:700}
#gof s{text-decoration:none;width:24px;height:2px;background:currentColor;border-radius:2px;
 animation:pux 2s var(--e) infinite}
@keyframes pux{0%,100%{transform:scaleX(.35);transform-origin:left}50%{transform:scaleX(1);transform-origin:left}}

/* ═══ ESCALA PARA TELAS MAIORES ═══ */
@media(min-width:600px){:root{--cx-w:62vw;--cd-w:22vw;--t1:21px;--t1f:30px;--t2:2.2em}
 #odo .n{font-size:26px}#lg{width:280px}#cta{font-size:14px;padding:11px 24px}
 .cd .g{font-size:15px}.cd .l,.cd .l b{font-size:8.5px}.cd .r{font-size:6.5px}}
@media(min-width:1000px){:root{--cx-w:44vw;--cd-w:15vw;--t1:24px;--t1f:37px;--t2:2.35em}
 #caixa{padding:20px 26px 22px;border-radius:22px 11px 22px 11px}
 .sb{font-size:17px}.ap{font-size:14px}.mn{font-size:11px}
 #odo{left:26px}#odo .n{font-size:31px}#odo .u{font-size:8px}
 .rg{left:26px}#reg{width:180px}
 #nav{right:22px}#nx{width:44px;height:44px}#pv{width:34px;height:34px}
 .cd{padding:9px 10px}.cd .g{font-size:17px}.cd .n{font-size:10px}
 .cd .l,.cd .l b{font-size:9.5px}.cd .r{font-size:7px}.bd{font-size:6.5px}
 .cab h4{font-size:9px}.cab i{font-size:6px}
 #cta{font-size:15px;padding:13px 28px}}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation:none!important}}

/* ── trocar de caminho ── */
#voltar{position:fixed;left:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:60;
 display:inline-flex;align-items:center;gap:6px;padding:7px 12px 7px 9px;border-radius:99px;
 background:rgba(16,42,67,.34);color:#fff;text-decoration:none;
 font-family:'JetBrains Mono',ui-monospace,monospace;font-size:9px;font-weight:500;
 letter-spacing:.11em;text-transform:uppercase;
 -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
 border:1px solid rgba(255,255,255,.28);opacity:.62;transition:opacity .3s ease}
#voltar:hover{opacity:1}
#voltar svg{display:block;flex:0 0 auto}
</style></head><body>

function cam(e){fx=e.fx;fy=e.fy;rx=e.rx;ry=e.ry;cx=e.x-fx*BACK;cy=e.y-fy*BACK;
 rumo=Math.atan2(fx,-fy);
 [...SER.children].forEach(g=>{const p=+g.getAttribute('data-p');
  g.setAttribute('transform',`translate(${(-rumo*160*p*.34).toFixed(1)},0)`)})}
function pj(px,py,pz){const dx=px-cx,dy=py-cy;
 const X=dx*rx+dy*ry,Y=dx*fx+dy*fy,Z=(pz||0)-ALT,d=Y*C-Z*S;
 if(d<9)return null;return{x:CX+(X/d)*FOC,y:CY-((Y*S+Z*C)/d)*FOC,d}}

function caixa(b,W,P,H,cor,tel){
 const q=(a,c)=>[b.x+b.rx*a+b.fx*c,b.y+b.ry*a+b.fy*c];
 const cn=[q(W,P),q(-W,P),q(-W,-P),q(W,-P)];
 const B=cn.map(p=>pj(p[0],p[1],0)),T=cn.map(p=>pj(p[0],p[1],H));
 if(B.some(x=>!x)||T.some(x=>!x))return null;
 return{B,T,d:B[0].d,q};
}
function pinta(slot,r,cor){
 const cT=nv(cor,r.d),cL=nv(dk(cor),r.d*1.02);let k=0;
 for(let i=0;i<4;i++){const j=(i+1)%4,fc=[r.B[i],r.B[j],r.T[j],r.T[i]];
  if(!areaP(fc)){slot.f[k].setAttribute('points','');k++;continue}
  slot.f[k].setAttribute('points',pts_(fc));slot.f[k].setAttribute('fill',i%2?cL:cT);k++}
 slot.f[4].setAttribute('points',pts_(r.T));slot.f[4].setAttribute('fill',nv('#B8AE9C',r.d*.85));
}

 const v=.62+((Math.sin(sd*9.7+i*2.3)+1)/2)*.5;
 p+=(i?'L':'M')+(x+Math.cos(a)*r*v*1.05).toFixed(1)+' '+(y+Math.sin(a)*r*v*.92).toFixed(1)+' '}
 return p+'Z'}

function carro(e,C,tom,uid,op){
 op=(op===undefined)?1:op;

 const q=(a,c)=>({x:e.x+e.fx*a+e.rx*c,y:e.y+e.fy*a+e.ry*c});
 const bl=[q(L,-W),q(L,W),q(-L,W),q(-L,-W)];
 const B=bl.map(p=>pj(p.x,p.y,1.5)),Md=bl.map(p=>pj(p.x,p.y,J));
 const tl=[q(L*.3,-W*.8),q(L*.3,W*.8),q(-L*.7,W*.8),q(-L*.7,-W*.8)].map(p=>pj(p.x,p.y,H+7));
 if(B.some(x=>!x)||Md.some(x=>!x)||tl.some(x=>!x)){Object.values(C).forEach(x=>x.setAttribute('opacity',0));$(uid).setAttribute('opacity',0);return}
 Object.values(C).forEach(x=>x.setAttribute('opacity',1));
 
 ['le','ld','tr','bs','tt','vd'].forEach(k=>C[k].setAttribute('opacity',0));
 // a arte do carro entra como imagem, ancorada na traseira e escalada pela distância
 const img=$(uid),tras=pj(e.x-e.fx*L,e.y-e.fy*L,1.5);
 if(!tras){img.setAttribute('opacity',0);return}
 const K=1.06, ACH=.86, BASE=.84;      // largura · achatamento vertical · ancoragem
 const larg=Math.abs((pj(e.x-e.fx*L+e.rx*W*K,e.y-e.fy*L+e.ry*W*K,1.5)||{x:tras.x}).x-
                     (pj(e.x-e.fx*L-e.rx*W*K,e.y-e.fy*L-e.ry*W*K,1.5)||{x:tras.x}).x);
 const alt=larg*(230/200)*ACH;
 const ex=larg/200, ey=(alt/230);
 img.setAttribute('transform',
  `translate(${(tras.x-larg/2).toFixed(1)},${(tras.y-alt*BASE).toFixed(1)}) scale(${ex.toFixed(4)},${ey.toFixed(4)})`);
 img.setAttribute('opacity',op.toFixed(3));
}

  const a2=pj(q.x+q.rx*49,q.y+q.ry*49,0),b2=pj(q.x-q.rx*49,q.y-q.ry*49,0);

  AP[i].c1.setAttribute('fill',nv('#2F5347',v.d));

const _r=document.createElement('span');
_r.style.cssText='position:absolute;visibility:hidden;white-space:pre;left:-9999px;top:0';
document.body.appendChild(_r);
function med(el){const c=getComputedStyle(el);
 ['fontFamily','fontSize','fontWeight','fontStyle','letterSpacing'].forEach(k=>_r.style[k]=c[k]);
 return t=>{_r.textContent=t;return _r.getBoundingClientRect().width}}
function quebra(el,txt){
 if(!txt)return[];const L=el.clientWidth||el.parentElement.clientWidth||300,w=med(el);
 if(w(txt)<=L)return[txt];const p=txt.split(' ');
 for(let k=2;k<=Math.min(4,p.length);k++){
  let best=null;
  (function rec(i,rest,acc){
   if(rest===1){const ls=acc.concat([p.slice(i).join(' ')]),ws=ls.map(w);
    if(ws.some(x=>x>L))return;
    for(let j=1;j<ws.length;j++)if(ws[j]<ws[j-1]*.995)return;
    const d=ws[ws.length-1]-ws[0];if(!best||d<best.d)best={ls,d};return}
   for(let j=i+1;j<=p.length-(rest-1);j++)rec(j,rest-1,acc.concat([p.slice(i,j).join(' ')]))
  })(0,k,[]);
  if(best)return best.ls}
 return[txt]}
function ajusta(el,txt){if(!txt)return;const L=el.clientWidth||300,w=med(el);
 const base=parseFloat(getComputedStyle(el).fontSize);let px=base;
 for(let i=0;i<10;i++){if(Math.max(...txt.split(' ').map(w))<=L*.97)break;
  px*=.94;if(px<base*.62){px=base*.62}el.style.fontSize=px+'px';if(px<=base*.62)break}}
let _d=0;
function paint(el,ls,base){_d=base;
 el.innerHTML=ls.map(l=>'<span class="ln">'+l.split(' ').map(x=>{
  const d=_d;_d+=44+Math.random()*30;
  return`<span class="w" style="--dl:${d|0}ms">${x}</span>`}).join(' ')+'</span>').join('');
 return _d}

/* ───── RÉGUA ───── */
const REG=$('reg'),TK=[],PAS=48,NT=30,UT=2400;
for(let i=0;i<NT;i++){const d=document.createElement('div');d.className='rg';
 d.innerHTML='<i></i><b></b>';REG.appendChild(d);TK.push(d)}
function kmDe(p){const q=cl(p);let i=0,ac=0,tot=B.reduce((s,b)=>s+b.dur,0);
 for(;i<B.length;i++){const f=(ac+B[i].dur)/tot;if(q<f||i===B.length-1)break;ac+=B[i].dur}
 const ini=ac/tot,fim=(ac+B[i].dur)/tot,l=cl((q-ini)/(fim-ini));
 return B[i].km[0]+(B[i].km[1]-B[i].km[0])*l}
function reg(p){const u=p*UT,base=Math.floor(u/PAS),mid=innerHeight/2,
 ALC=innerHeight*.5,V1=44,V2=94;
 TK.forEach((el,k)=>{const uk=(base+k-(NT>>1))*PAS,d=uk-u,y=mid+d,pr=1-cl(Math.abs(d)/ALC);
  const fs=8+Math.pow(pr,1.35)*13;
  let op=Math.pow(pr,1.6)*(d>0?.72:.42);
  const ad=Math.abs(d);if(ad<V2)op*=cl((ad-V1)/(V2-V1));
  const c0=[132,150,164],c1=[16,42,67],mx=Math.pow(pr,1.2);
  el.style.color=`rgb(${c0.map((v,j)=>Math.round(v+(c1[j]-v)*mx)).join(',')})`;
  const km=kmDe(uk/UT),ka=kmDe((uk-PAS)/UT),b=el.querySelector('b'),ln=el.querySelector('i');
  const mu=Math.round(km/10)!==Math.round(ka/10);
  el.style.transform=`translateY(${(y-fs*.6).toFixed(1)}px)`;
  el.style.opacity=op.toFixed(3);
  b.textContent=mu?fmt(Math.round(km/10)*10):'';
  b.style.fontSize=fs.toFixed(1)+'px';
  ln.style.width=((mu?12:7)+pr*12).toFixed(1)+'px';
  ln.style.opacity=mu?'.9':'.45'});}

/* ───── MOTOR ───── */
const CXA=$('caixa'),APO=$('apoio'),ODO=$('odo'),CTA=$('cta');
const TOT=B.reduce((s,b)=>s+b.dur,0);
const PARA=i=>{let ac=0;for(let k=0;k<i;k++)ac+=B[k].dur;return(ac+B[i].dur*.84)/TOT};
let P=0,an=null,bl=-1,alSt=-1;
B.forEach((b,k)=>{const d=document.createElement('button');d.className='pt';
 d.setAttribute('aria-label','Bloco '+(k+1));
 d.addEventListener('click',ev=>{ev.stopPropagation();vai(k)});$('pts').appendChild(d)});

let ult=0;
function vai(i){
 const ag=Date.now();if(ag-ult<420)return;
 i=Math.min(B.length-1,i);if(an||i===bl||i<0)return;ult=ag;
 if(bl<0)$('hero').classList.add('fora');
 limpaAl();limpaF2();bl=i;texto(i);pontos();
 const de=P,pa=PARA(i);
 an={de,pa,t0:performance.now(),dur:B[i].lin?B[i].dur*1000:Math.min(3200,1400+Math.abs(pa-de)*4600)};
 requestAnimationFrame(passo)}
let alT=[];
function limpaAl(){alT.forEach(clearTimeout);alT=[];alSt=-1}
function rodaAl(){
 limpaAl();const c=$('c-al');if(!c)return;
 c.innerHTML=alHtml(0);alSt=0;
 [1,2].forEach((e,k)=>{
  alT.push(setTimeout(()=>{
   const el=$('c-al');if(!el)return;
   el.style.transition='transform .34s var(--e)';
   el.style.transform='rotateX(90deg)';
   alT.push(setTimeout(()=>{el.innerHTML=alHtml(e);el.style.transform='rotateX(0)';alSt=e},360));
  },700+k*1500));
 });
}
let f2T=[];
function limpaF2(){f2T.forEach(clearTimeout);f2T=[]}
function rodaF2(){
 limpaF2();const b=B[bl];if(!b||!b.f2)return;
 f2T.push(setTimeout(()=>{
  texto(bl,b.f2);
  f2T.push(setTimeout(()=>{
   ODO.querySelector('.n').textContent='0';
   ODO.querySelector('.u').textContent='QUILÔMETROS · CAPÍTULO 1';
   CTA.textContent='Começar o prontuário';
  },520));
 },2600));
}
function passo(t){const k=cl((t-an.t0)/an.dur);
 const lin=bl>=0&&B[bl]&&B[bl].lin;
 const e=lin?k:(k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2);
 P=an.de+(an.pa-an.de)*e;draw();
 if(k<1)requestAnimationFrame(passo);
 else{an=null;const n=B[bl].n;if(n===3)rodaAl();if(B[bl].f2)rodaF2()}}
function pontos(){[...$('pts').children].forEach((d,k)=>{
 d.classList.toggle('on',k===bl);d.classList.toggle('ps',k<bl)});
 $('nx').classList.toggle('fim',bl>=B.length-1);$('pv').classList.toggle('fim',bl<=0)}

function texto(i,alt){
 const b=alt||B[i];
 CXA.classList.remove('on');APO.classList.remove('on');
 setTimeout(()=>{
  CXA.classList.toggle('forte',!!b.forte);
  CXA.classList.toggle('gancho',!!b.gancho);
  CXA.innerHTML=(b.pre?'<p class="pre fade"></p>':'')+'<h2 class="tt"></h2>';
  if(b.pre){const pp=CXA.firstChild;pp.textContent=b.pre;pp.style.setProperty('--dl','0ms')}
  const h=CXA.querySelector('.tt');
  h.textContent=b.h;ajusta(h,b.h);h.textContent='';
  let dl=paint(h,quebra(h,b.h),b.pre?260:0);
  if(b.dz){const sp=document.createElement('span');sp.className='dz'+(b.fogo?' fogo':'');
   if(b.dzE)sp.style.fontSize=b.dzE+'em';h.appendChild(sp);
   if(!b.gancho){sp.textContent=b.dz;ajusta(sp,b.dz);sp.textContent=''}
   dl=paint(sp,quebra(sp,b.dz),dl+110)}
  if(b.sb){const p=document.createElement('p');p.className='sb';CXA.appendChild(p);
   dl=paint(p,quebra(p,b.sb),dl+90)}
  if(b.mn){const p=document.createElement('p');p.className='mn fade';p.textContent=b.mn;
   p.style.setProperty('--dl',(dl+60|0)+'ms');CXA.appendChild(p);dl+=140}
  if(b.ap){const p=document.createElement('p');p.className='ap fade';p.textContent=b.ap;
   p.style.setProperty('--dl',(dl+80|0)+'ms');CXA.appendChild(p);dl+=160}
  APO.innerHTML='';
  if(b.cd){b.cd.forEach((c,k)=>{const d=document.createElement('div');d.className='cd';
   d.style.width=`calc(var(--cd-w) * ${c.w*1.7})`;
   d.style.setProperty('--dl',(dl+120+k*110|0)+'ms');
   d.innerHTML=c.id==='al'?alHtml(0):c.html;if(c.id)d.id='c-'+c.id;APO.appendChild(d)})}
  requestAnimationFrame(()=>{CXA.classList.add('on');
   const r=CXA.offsetTop+CXA.offsetHeight+18;APO.style.top=r+'px';
   setTimeout(()=>{APO.classList.add('on');APO.style.top=(CXA.offsetTop+CXA.offsetHeight+18)+'px'},60)});
 },380)}

function draw(){
 let i=0,ac=0;for(;i<B.length;i++){const f=(ac+B[i].dur)/TOT;if(P<f||i===B.length-1)break;ac+=B[i].dur}
 const b=B[i],ini=ac/TOT,fim=(ac+b.dur)/TOT,lp=cl((P-ini)/(fim-ini));
 INVERTE=(b.n===6);
 if(INVERTE)MIX=cl((lp-.33)/.15);
 const av=b.curva?b.curva(lp):lp;
 mundo(b.t[0]+(b.t[1]-b.t[0])*av);
 ODO.classList.toggle('on',bl>=0);REG.classList.toggle('on',bl>=0);
 ODO.querySelector('.n').textContent=fmt(b.km[0]+(b.km[1]-b.km[0])*lp);
 ODO.querySelector('.u').textContent='QUILÔMETROS';
 reg(P);
 CTA.classList.toggle('on',bl>=1&&b.n!==5);
 CTA.textContent=b.n>=6?'Começar o prontuário':'Comece pelo próximo abastecimento';
 }

/* ───── GESTOS ───── */
let acu=0,ty=0,tx=0,tt0=0,mov=false;
addEventListener('wheel',ev=>{if(ev.cancelable)ev.preventDefault();if(an)return;acu+=ev.deltaY;
 if(acu>42){acu=0;vai(bl+1)}else if(acu<-42){acu=0;vai(bl-1)}},{passive:false});

function ehBotao(t){return !!(t&&t.closest&&t.closest('#nav,#cta,#voltar'))}
document.addEventListener('touchstart',ev=>{
 const t=ev.touches[0];ty=t.clientY;tx=t.clientX;tt0=Date.now();mov=false},{passive:true});
document.addEventListener('touchmove',ev=>{
 const t=ev.touches[0];
 if(Math.abs(ty-t.clientY)>8||Math.abs(tx-t.clientX)>8)mov=true},{passive:true});
document.addEventListener('touchend',ev=>{
 if(ehBotao(ev.target))return;
 const t=ev.changedTouches[0],dy=ty-t.clientY,dx=tx-t.clientX;
 if(Math.abs(dy)>24&&Math.abs(dy)>Math.abs(dx)){vai(bl+(dy>0?1:-1));return}
 if(!mov&&Date.now()-tt0<500)vai(bl<0?0:bl+1);      // toque simples também avança
},{passive:true});

addEventListener('keydown',ev=>{if(['ArrowDown','PageDown',' '].includes(ev.key)){ev.preventDefault();vai(bl+1)}
 if(['ArrowUp','PageUp'].includes(ev.key)){ev.preventDefault();vai(bl-1)}});

['click','pointerup'].forEach(e=>{
 $('nx').addEventListener(e,ev=>{ev.stopPropagation();vai(bl+1)});
 $('pv').addEventListener(e,ev=>{ev.stopPropagation();vai(bl-1)});
});
$('palco').addEventListener('click',ev=>{if(!ehBotao(ev.target))vai(bl<0?0:bl+1)});
addEventListener('resize',()=>{if(bl>=0)texto(bl);draw()});
serras();P=PARA(0)*.05;pontos();draw();

/* destino do CTA final */
const PAGINA_PLANOS='planos-razao.html';
['click','pointerup'].forEach(e=>CTA.addEventListener(e,ev=>{ev.stopPropagation();location.href=PAGINA_PLANOS}));
